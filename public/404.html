<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Chrema</title>
    <script>
      // Single Page App redirect trick for CRA
      // Stores the path and redirects to index.html which loads React
      var path = window.location.pathname;
      sessionStorage.setItem('redirect', path);
      window.location.replace('/');
    </script>
  </head>
  <body></body>
</html>
